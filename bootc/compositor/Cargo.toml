[package]
name = "compositor"
version = "0.1.0"
edition = "2024"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
] }
smithay-drm-extras = { version = "0.1.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
